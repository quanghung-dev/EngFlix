services:
  db:
    image: postgres:15-alpine
    container_name: engflixnodejs_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: engflix
    ports:
      - "5430:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d engflix"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: engflix_backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db  
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE=engflix
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
